<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axion Notes</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        user-select: none;
        -webkit-user-select: none;
      }

      .splash {
        width: 320px;
        min-height: 188px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 13px;
        border: 1px solid rgba(113, 124, 140, 0.24);
        border-radius: 16px;
        background-color: #f9fcff;
        background-image: url("./paper-texture.svg");
        background-blend-mode: multiply;
        background-size: cover;
        box-shadow:
          0 18px 44px rgba(36, 51, 66, 0.24),
          0 2px 8px rgba(36, 51, 66, 0.12);
      }

      .icon {
        width: 64px;
        height: 64px;
      }

      .title {
        margin: 0;
        color: #263544;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.2;
      }

      .status {
        margin: 0;
        color: #617285;
        font-size: 13px;
        line-height: 1.3;
      }

      .loader {
        width: 92px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(97, 114, 133, 0.18);
      }

      .loader::before {
        content: "";
        display: block;
        width: 38px;
        height: 100%;
        border-radius: inherit;
        background: #1594c8;
        animation: slide 1.1s ease-in-out infinite;
      }

      @keyframes slide {
        0% {
          transform: translateX(-42px);
        }

        50% {
          transform: translateX(96px);
        }

        100% {
          transform: translateX(96px);
        }
      }

      @media (prefers-color-scheme: dark) {
        .splash {
          border-color: rgba(160, 177, 194, 0.2);
          background-color: #1f2a35;
          background-image: url("./paper-texture.svg");
          background-blend-mode: soft-light;
          box-shadow:
            0 18px 44px rgba(0, 0, 0, 0.34),
            0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .title {
          color: #e9f0f6;
        }

        .status {
          color: #aab8c7;
        }

        .loader {
          background: rgba(170, 184, 199, 0.18);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="Axion Notes is starting">
      <img class="icon" src="./axion_notes_icon256-splash.png" alt="" />
      <h1 class="title">Axion Notes</h1>
      <p class="status">Starting...</p>
      <div class="loader" aria-hidden="true"></div>
    </main>
  </body>
</html>
